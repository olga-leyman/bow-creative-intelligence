<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Body of Work · Creative library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20261015e" />
  <style>
    body.library-page { display: block; height: auto; min-height: 100%; }
    .library-page .topbar { position: sticky; top: 0; }
    .library-page .stage { min-height: calc(100vh - 74px); align-items: stretch; }
    .library-page h1 { font-size: 40px; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0 8px; }
    .filters input[type="search"], .filters select {
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
    }
    .filters input[type="search"] { min-width: 220px; }
    .shot {
      width: 72px;
      height: 96px;
      object-fit: cover;
      border-radius: 6px;
      background: #111;
      display: block;
    }
    .library-page th button {
      appearance: none;
      background: none;
      border: 0;
      padding: 0;
      color: inherit;
      font: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
      cursor: pointer;
    }
    .library-page th button:hover { color: var(--ink); }
    .library-page .inspector {
      display: block;
      position: sticky;
      top: 0;
      z-index: 8;
      height: 100vh;
      overflow: hidden;
      width: 0;
      padding: 0;
      border: 0;
      transition: width 0.28s ease;
    }
    .library-page .inspector.open {
      width: 380px;
      padding: 18px 16px 40px;
      border-left: 1px solid var(--line);
      overflow-y: auto;
    }
    .library-page .inspector .sheet { min-width: 320px; }
    .library-page .copy { white-space: pre-wrap; font-size: 14.5px; line-height: 1.5; margin: 8px 0 12px; }
    @media (max-width: 860px) {
      .library-page .inspector.open {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(100%, 420px);
        z-index: 30;
        box-shadow: -12px 0 40px rgba(19, 42, 58, 0.16);
        display: block !important;
      }
    }
  </style>
</head>
<body class="library-page">
  <header class="topbar">
    <div>
      <div class="crumb">Body of Work / <strong>Creative library</strong></div>
      <div class="meta-line" id="metaLine">Loading the tests…</div>
    </div>
  </header>
  <div class="stage">
    <main class="content" id="page"></main>
    <aside class="inspector" id="inspector"></aside>
  </div>
  <script src="creatives.js?v=20261015a"></script>
</body>
</html>
